
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Türk Sohbet</title>
<script src="/socket.io/socket.io.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.170.0/three.module.js"
  }
}
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#87b9e8;font-family:Arial,sans-serif;color:white}
#game{position:fixed;inset:0}
#hud{position:fixed;inset:0;pointer-events:none}
#logo{position:absolute;top:20px;left:22px;font-size:24px;font-weight:900;text-shadow:0 2px 8px #0005}
#logo span{color:#65e1ff}
#online{position:absolute;top:24px;right:22px;background:#121b2ad9;padding:10px 15px;border-radius:12px;font-size:13px}
#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:5px;height:5px;border-radius:50%;background:white;box-shadow:0 0 5px #000}
#hint{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);background:#111b2ac9;padding:12px 18px;border-radius:12px;font-size:13px;color:#ddd}
#chat{position:absolute;bottom:75px;left:20px;width:320px;pointer-events:auto}
#messages{height:180px;overflow:auto;padding:8px;background:linear-gradient(transparent,#101827bb);font-size:13px;overflow-wrap:anywhere}
#chatform{display:flex;gap:6px;margin-top:5px}
#chatinput{flex:1;min-width:0;padding:12px;border:1px solid #ffffff22;background:#111b2ae8;color:white;border-radius:10px;outline:none}
#send{padding:0 15px;border:0;border-radius:10px;background:#42b7ec;color:#07131b;font-weight:bold;cursor:pointer}
#start{position:fixed;inset:0;background:#111827aa;display:flex;align-items:center;justify-content:center;pointer-events:auto}
#box{width:min(380px,90vw);background:#172235;border:1px solid #ffffff15;border-radius:22px;padding:28px;text-align:center;box-shadow:0 20px 70px #0005}
#box h1{margin-bottom:8px;font-size:30px}
#box p{color:#aab9ce;font-size:14px;margin-bottom:20px}
#name{width:100%;padding:14px;border-radius:10px;border:1px solid #ffffff22;background:#0c1525;color:white;margin-bottom:12px}
#play{width:100%;padding:14px;border:0;border-radius:10px;background:#48baf2;color:#07121b;font-weight:bold;font-size:16px;cursor:pointer}
#toast{position:absolute;top:80px;left:50%;transform:translateX(-50%);background:#172235;padding:10px 18px;border-radius:10px;display:none}
</style>
</head>
<body>
<div id="game"></div>

<div id="hud">
<div id="logo">TÜRK <span>SOHBET</span></div>
<div id="online">🟢 <span id="count">0</span> Online</div>
<div id="crosshair"></div>
<div id="hint">WASD : Hareket &nbsp; SHIFT : Koş &nbsp; Mouse : Kamera</div>
<div id="chat">
<div id="messages"></div>
<form id="chatform">
<input id="chatinput" placeholder="Mesaj yaz..." maxlength="250" autocomplete="off">
<button id="send">Gönder</button>
</form>
</div>
<div id="toast"></div>

<div id="start">
<div id="box">
<h1>🇹🇷 Türk Sohbet</h1>
<p>Online dünyaya hoş geldin!<br>İsmini belirle ve arkadaşlarınla buluş.</p>
<input id="name" maxlength="18" placeholder="Oyuncu adın..." autocomplete="off">
<button id="play">OYUNA GİR</button>
</div>
</div>
</div>

<script type="module">
import * as THREE from "three";

const socket = io();
const container = document.getElementById("game");

let scene, camera, renderer, clock;
let player, playerMesh;
let yaw = 0, pitch = 0.25;
let playing = false;
let mouseLocked = false;
const keys = {};
const remotePlayers = {};
let lastMoveSent = 0;

init();

function init(){
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87b9e8);
  scene.fog = new THREE.Fog(0x87b9e8, 45, 150);

  camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 500);

  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  container.appendChild(renderer.domElement);

  clock = new THREE.Clock();

  const hemi = new THREE.HemisphereLight(0xd8edff,0x607348,2);
  scene.add(hemi);

  const sun = new THREE.DirectionalLight(0xffffff,3);
  sun.position.set(30,50,20);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048,2048);
  scene.add(sun);

  createWorld();
  createPlayer();

  window.addEventListener("resize",onResize);
  document.addEventListener("keydown",e=>{
    keys[e.code]=true;
    if(["Space","ArrowUp","ArrowDown"].includes(e.code))e.preventDefault();
  });
  document.addEventListener("keyup",e=>keys[e.code]=false);

  renderer.domElement.addEventListener("click",()=>{
    if(playing)renderer.domElement.requestPointerLock();
  });

  document.addEventListener("pointerlockchange",()=>{
    mouseLocked=document.pointerLockElement===renderer.domElement;
  });

  document.addEventListener("mousemove",e=>{
    if(!mouseLocked||!playing)return;
    yaw-=e.movementX*0.0025;
    pitch-=e.movementY*0.002;
    pitch=Math.max(-1.1,Math.min(1.1,pitch));
  });

  document.getElementById("play").onclick=startGame;
  document.getElementById("chatform").onsubmit=sendChat;

  setupOnline();
  animate();
}

function createWorld(){
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(300,300),
    new THREE.MeshStandardMaterial({color:0x5c9c59})
  );
  ground.rotation.x=-Math.PI/2;
  ground.receiveShadow=true;
  scene.add(ground);

  // Yol
  const road = new THREE.Mesh(
    new THREE.PlaneGeometry(16,300),
    new THREE.MeshStandardMaterial({color:0x52565c})
  );
  road.rotation.x=-Math.PI/2;
  road.position.set(0,0.02,0);
  scene.add(road);

  // Yol çizgileri
  for(let z=-140;z<140;z+=12){
    const line=new THREE.Mesh(
      new THREE.BoxGeometry(0.25,0.03,5),
      new THREE.MeshStandardMaterial({color:0xffffff})
    );
    line.position.set(0,0.04,z);
    scene.add(line);
  }

  // Park
  for(let i=0;i<70;i++){
    const x=(Math.random()-0.5)*180;
    const z=(Math.random()-0.5)*250;
    if(Math.abs(x)<13)continue;
    createTree(x,z);
  }

  // Evler
  for(let i=0;i<35;i++){
    const side=Math.random()<0.5?-1:1;
    const x=side*(18+Math.random()*45);
    const z=(Math.random()-0.5)*240;
    createHouse(x,z);
  }

  // Park lambaları
  for(let z=-120;z<=120;z+=25){
    createLamp(-10,z);
    createLamp(10,z);
  }
}

function createTree(x,z){
  const trunk=new THREE.Mesh(
    new THREE.CylinderGeometry(0.3,0.45,3,7),
    new THREE.MeshStandardMaterial({color:0x76502b})
  );
  trunk.position.set(x,1.5,z);
  trunk.castShadow=true;
  scene.add(trunk);

  const leaves=new THREE.Mesh(
    new THREE.SphereGeometry(2.2,8,7),
    new THREE.MeshStandardMaterial({color:0x287c40})
  );
  leaves.position.set(x,4,z);
  leaves.scale.y=1.2;
  leaves.castShadow=true;
  scene.add(leaves);
}

function createHouse(x,z){
  const colors=[0xe4d1af,0xc4d7df,0xd5b7b0,0xd7d8be,0xb8c9aa];
  const color=colors[Math.floor(Math.random()*colors.length)];

  const body=new THREE.Mesh(
    new THREE.BoxGeometry(10,7,10),
    new THREE.MeshStandardMaterial({color})
  );
  body.position.set(x,3.5,z);
  body.castShadow=true;
  body.receiveShadow=true;
  scene.add(body);

  const roof=new THREE.Mesh(
    new THREE.ConeGeometry(8,4,4),
    new THREE.MeshStandardMaterial({color:0x743c32})
  );
  roof.position.set(x,9,z);
  roof.rotation.y=Math.PI/4;
  roof.castShadow=true;
  scene.add(roof);

  const door=new THREE.Mesh(
    new THREE.BoxGeometry(1.6,3,0.15),
    new THREE.MeshStandardMaterial({color:0x65452c})
  );
  door.position.set(x,1.5,z+5.06);
  scene.add(door);
}

function createLamp(x,z){
  const pole=new THREE.Mesh(
    new THREE.CylinderGeometry(0.12,0.15,7,6),
    new THREE.MeshStandardMaterial({color:0x555b62})
  );
  pole.position.set(x,3.5,z);
  scene.add(pole);

  const bulb=new THREE.Mesh(
    new THREE.SphereGeometry(0.4,8,8),
    new THREE.MeshStandardMaterial({color:0xfff0bb,emissive:0xffdd88,emissiveIntensity:1})
  );
  bulb.position.set(x,7,z);
  scene.add(bulb);
}

function createPlayer(){
  player=new THREE.Group();

  const body=new THREE.Mesh(
    new THREE.BoxGeometry(0.8,1.2,0.45),
    new THREE.MeshStandardMaterial({color:0x278bd1})
  );
  body.position.y=1.55;
  body.castShadow=true;
  player.add(body);

  const head=new THREE.Mesh(
    new THREE.SphereGeometry(0.42,16,12),
    new THREE.MeshStandardMaterial({color:0xffd1a6})
  );
  head.position.y=2.45;
  head.castShadow=true;
  player.add(head);

  const legs=[];
  for(let x of [-0.23,0.23]){
    const leg=new THREE.Mesh(
      new THREE.BoxGeometry(0.25,0.7,0.3),
      new THREE.MeshStandardMaterial({color:0x27384d})
    );
    leg.position.set(x,0.55,0);
    leg.castShadow=true;
    player.add(leg);
    legs.push(leg);
  }

  const arms=[];
  for(let x of [-0.55,0.55]){
    const arm=new THREE.Mesh(
      new THREE.BoxGeometry(0.22,0.85,0.25),
      new THREE.MeshStandardMaterial({color:0x278bd1})
    );
    arm.position.set(x,1.6,0);
    player.add(arm);
    arms.push(arm);
  }

  player.userData.legs=legs;
  player.userData.arms=arms;

  player.position.set(0,0,0);
  scene.add(player);
  playerMesh=player;
}

function makeRemote(id,name){
  const group=new THREE.Group();

  const body=new THREE.Mesh(
    new THREE.BoxGeometry(0.8,1.2,0.45),
    new THREE.MeshStandardMaterial({color:0xe0a331})
  );
  body.position.y=1.55;
  group.add(body);

  const head=new THREE.Mesh(
    new THREE.SphereGeometry(0.42,16,12),
    new THREE.MeshStandardMaterial({color:0xffd1a6})
  );
  head.position.y=2.45;
  group.add(head);

  const label=document.createElement("div");
  label.textContent=name;
  label.style.cssText="color:white;background:#172235cc;padding:4px 9px;border-radius:8px;font:12px Arial;white-space:nowrap";
  const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:createLabelTexture(name)}));
  sprite.scale.set(3,0.7,1);
  sprite.position.y=3.3;
  group.add(sprite);

  scene.add(group);
  remotePlayers[id]={group,name};
  return remotePlayers[id];
}

function createLabelTexture(name){
  const canvas=document.createElement("canvas");
  canvas.width=512;canvas.height=128;
  const ctx=canvas.getContext("2d");
  ctx.fillStyle="#172235cc";
  ctx.beginPath();
  ctx.roundRect(20,20,472,88,24);
  ctx.fill();
  ctx.fillStyle="white";
  ctx.font="bold 42px Arial";
  ctx.textAlign="center";
  ctx.fillText(name,256,78);
  const texture=new THREE.CanvasTexture(canvas);
  return texture;
}

function startGame(){
  const name=document.getElementById("name").value.trim()||"Oyuncu";
  document.getElementById("start").style.display="none";
  playing=true;
  socket.emit("setName",name);
  renderer.domElement.requestPointerLock();
  addMessage("Sistem","Dünyaya hoş geldin!");
}

function setupOnline(){
  socket.on("welcome",data=>{
    document.getElementById("count").textContent=Object.keys(data.players||{}).length;
    for(const id in data.players){
      if(id===socket.id)continue;
      const p=data.players[id];
      const r=makeRemote(id,p.name);
      r.group.position.set(p.x,p.y,p.z);
    }
  });

  socket.on("playerJoined",p=>{
    if(remotePlayers[p.id])return;
    const r=makeRemote(p.id,p.name);
    r.group.position.set(p.x,p.y,p.z);
    updateCount();
    addMessage("Sistem",p.name+" oyuna katıldı.");
  });

  socket.on("playerMoved",p=>{
    const r=remotePlayers[p.id];
    if(!r)return;
    r.group.position.set(p.x,p.y,p.z);
    r.group.rotation.y=p.rotation;
  });

  socket.on("playerUpdated",p=>{
    const r=remotePlayers[p.id];
    if(!r)return;
    r.group.children.forEach(c=>{
      if(c.isSprite){
        c.material.map=createLabelTexture(p.name);
        c.material.needsUpdate=true;
      }
    });
    r.name=p.name;
  });

  socket.on("playerLeft",id=>{
    if(remotePlayers[id]){
      scene.remove(remotePlayers[id].group);
      delete remotePlayers[id];
    }
    updateCount();
    addMessage("Sistem","Bir oyuncu ayrıldı.");
  });

  socket.on("chatMessage",d=>{
    addMessage(d.name,d.message);
  });
}

function updateCount(){
  document.getElementById("count").textContent=Object.keys(remotePlayers).length+1;
}

function sendChat(e){
  e.preventDefault();
  const input=document.getElementById("chatinput");
  const msg=input.value.trim();
  if(!msg)return;
  socket.emit("chat",msg);
  input.value="";
}

function addMessage(name,msg){
  const box=document.getElementById("messages");
  const row=document.createElement("div");
  const n=document.createElement("b");
  n.textContent=name+": ";
  const m=document.createElement("span");
  m.textContent=msg;
  row.append(n,m);
  box.appendChild(row);
  box.scrollTop=box.scrollHeight;
  while(box.children.length>60)box.removeChild(box.firstChild);
}

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);

  if(playing){
    const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
    const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
    const dir=new THREE.Vector3();

    if(keys["KeyW"])dir.add(forward);
    if(keys["KeyS"])dir.sub(forward);
    if(keys["KeyD"])dir.add(right);
    if(keys["KeyA"])dir.sub(right);

    const moving=dir.length()>0;
    const running=keys["ShiftLeft"]||keys["ShiftRight"];
    const speed=running?12:6;

    if(moving){
      dir.normalize();
      player.position.addScaledVector(dir,speed*dt);
      player.rotation.y=Math.atan2(dir.x,dir.z);
    }

    // Animasyon
    if(moving){
      const t=clock.elapsedTime*speed;
      player.userData.legs[0].rotation.x=Math.sin(t)*0.65;
      player.userData.legs[1].rotation.x=-Math.sin(t)*0.65;
      player.userData.arms[0].rotation.x=-Math.sin(t)*0.45;
      player.userData.arms[1].rotation.x=Math.sin(t)*0.45;
    }else{
      player.userData.legs.forEach(l=>l.rotation.x=0);
      player.userData.arms.forEach(a=>a.rotation.x=0);
    }

    const target=player.position.clone().add(new THREE.Vector3(0,1.7,0));
    const distance=running?7:6;
    const camOffset=new THREE.Vector3(
      Math.sin(yaw)*distance,
      2.5+pitch*3,
      Math.cos(yaw)*distance
    );
    camera.position.lerp(target.clone().add(camOffset),0.12);
    camera.lookAt(target);

    const now=Date.now();
    if(now-lastMoveSent>50){
      socket.emit("move",{
        x:player.position.x,
        y:player.position.y,
        z:player.position.z,
        rotation:player.rotation.y
      });
      lastMoveSent=now;
    }
  }

  renderer.render(scene,camera);
}

function onResize(){
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
}
</script>
</body>
</html>
